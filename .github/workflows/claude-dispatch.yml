name: Claude Dispatch

on:
    workflow_call:

concurrency:
    group: claude-dispatch-${{ github.repository }}-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    dispatch:
        if: >
            github.event.comment.user.login == 'camilleislasse' &&
            contains(github.event.comment.body, '@guiziwebbot')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write

        steps:
            -
                uses: actions/create-github-app-token@v1
                id: app-token
                with:
                    app-id: ${{ secrets.APP_ID }}
                    private-key: ${{ secrets.APP_PRIVATE_KEY }}
                    owner: Guiziweb
                    repositories: ${{ github.event.repository.name }}

            -
                uses: actions/github-script@v7
                id: classify
                with:
                    github-token: ${{ steps.app-token.outputs.token }}
                    script: |
                        const isPr = !!context.payload.issue.pull_request
                        const isFix = /@guiziwebbot\s+fix\b/i.test(context.payload.comment.body)
                        const mode = isPr ? (isFix ? 'revise' : 'review') : (isFix ? 'fix' : 'none')
                        const number = context.payload.issue.number
                        core.setOutput('mode', mode)
                        core.setOutput('number', String(number))
                        let checkoutRef = ''
                        if (mode === 'revise') {
                            const pr = await github.rest.pulls.get({
                                owner: context.repo.owner, repo: context.repo.repo, pull_number: number,
                            })
                            checkoutRef = pr.data.head.ref
                        }
                        core.setOutput('checkout_ref', checkoutRef)
                        if (mode === 'none') return
                        await github.rest.reactions.createForIssueComment({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            comment_id: context.payload.comment.id,
                            content: 'eyes',
                        })

            -
                if: steps.classify.outputs.mode != 'none'
                uses: actions/checkout@v4
                with:
                    token: ${{ steps.app-token.outputs.token }}
                    ref: ${{ steps.classify.outputs.checkout_ref }}
                    fetch-depth: 0

            -
                if: steps.classify.outputs.mode == 'fix' || steps.classify.outputs.mode == 'revise'
                env:
                    GH_TOKEN: ${{ steps.app-token.outputs.token }}
                run: |
                    USER_ID=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
                    git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
                    git config user.email "${USER_ID}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

            -
                if: steps.classify.outputs.mode == 'review'
                uses: anthropics/claude-code-action@v1
                with:
                    claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    github_token: ${{ steps.app-token.outputs.token }}
                    plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
                    plugins: 'code-review@claude-code-plugins'
                    allowed_bots: 'guiziwebbot'
                    prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ steps.classify.outputs.number }} --comment'

            -
                if: steps.classify.outputs.mode == 'fix'
                uses: anthropics/claude-code-action@v1
                with:
                    claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    github_token: ${{ steps.app-token.outputs.token }}
                    allowed_bots: 'guiziwebbot'
                    claude_args: '--permission-mode acceptEdits --allowedTools Edit,Write,Read,Glob,Grep,Bash(gh:*),Bash(git:*)'
                    prompt: |
                        Tu travailles sur le repo ${{ github.repository }}, à propos de l'issue #${{ steps.classify.outputs.number }}.

                        1. Lis l'issue #${{ steps.classify.outputs.number }} (titre, description, commentaires).
                        2. Implémente le correctif décrit, en suivant les conventions du repo (CLAUDE.md et .claude/rules s'ils existent).
                        3. Ouvre une Pull Request dont le corps contient "Closes #${{ steps.classify.outputs.number }}".

                        Si l'issue est ambiguë ou que le correctif n'est pas évident, n'invente rien : commente l'issue en taguant @camilleislasse avec tes questions, sans ouvrir de PR.

            -
                if: steps.classify.outputs.mode == 'revise'
                uses: anthropics/claude-code-action@v1
                with:
                    claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    github_token: ${{ steps.app-token.outputs.token }}
                    allowed_bots: 'guiziwebbot'
                    claude_args: '--permission-mode acceptEdits --allowedTools Edit,Write,Read,Glob,Grep,Bash(gh:*),Bash(git:*)'
                    prompt: |
                        Tu travailles sur la Pull Request #${{ steps.classify.outputs.number }} du repo ${{ github.repository }}. Sa branche est déjà checkout dans le runner.

                        1. Lis sur la PR #${{ steps.classify.outputs.number }} le dernier commentaire de camilleislasse contenant "@guiziwebbot fix" : c'est le retour de review à appliquer.
                        2. Applique ce retour au code, en suivant les conventions du repo (CLAUDE.md et .claude/rules s'ils existent).
                        3. Commit et push sur la branche COURANTE de la PR. N'ouvre PAS de nouvelle PR.

                        Si le retour est ambigu, n'invente rien : commente la PR en taguant @camilleislasse, sans rien pousser.