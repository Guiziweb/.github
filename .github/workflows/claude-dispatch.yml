name: Claude Dispatch

on:
    workflow_call:

concurrency:
    group: claude-dispatch-${{ github.repository }}-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    dispatch:
        if: >
            github.event.comment.user.login == 'camilleislasse' &&
            contains(github.event.comment.body, '@guiziwebbot')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write
        env:
            APP_ENV: test
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?serverVersion=8.4"

        steps:
            -
                uses: actions/create-github-app-token@v1
                id: app-token
                with:
                    app-id: ${{ secrets.APP_ID }}
                    private-key: ${{ secrets.APP_PRIVATE_KEY }}
                    owner: Guiziweb
                    repositories: ${{ github.event.repository.name }}

            -
                name: Acknowledge and classify
                id: classify
                uses: Guiziweb/.github/.github/actions/classify-dispatch@feat/claude-dispatch
                with:
                    github-token: ${{ steps.app-token.outputs.token }}

            -
                name: Checkout (PR head, else default branch)
                uses: actions/checkout@v4
                with:
                    ref: ${{ steps.classify.outputs.head_ref || github.event.repository.default_branch }}
                    fetch-depth: 0

            -
                name: Setup Sylius test application
                uses: Guiziweb/.github/.github/actions/setup-test-app@feat/claude-dispatch
                with:
                    php-version: "8.3"

            -
                name: Restore Claude session (per item)
                id: session
                uses: Guiziweb/.github/.github/actions/restore-session@feat/claude-dispatch
                with:
                    github-token: ${{ steps.app-token.outputs.token }}
                    issue-number: ${{ github.event.issue.number }}

            -
                name: DEBUG session dir after restore (TEMP)
                shell: bash
                run: |
                    echo "cwd=$(pwd)  GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
                    echo "== ~/.claude/projects after restore =="
                    ls -la ~/.claude/projects/ 2>/dev/null || echo "(absent)"
                    ls -la ~/.claude/projects/*/ 2>/dev/null || echo "(no project subdir)"

            -
                id: claude
                uses: anthropics/claude-code-action@v1
                with:
                    claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    github_token: ${{ steps.app-token.outputs.token }}
                    allowed_bots: 'guiziwebbot'
                    plugin_marketplaces: 'https://github.com/Guiziweb/guiziweb-plugins.git'
                    plugins: 'guiziweb-bot@guiziweb-plugins'
                    claude_args: '${{ steps.session.outputs.resume-args }} --permission-mode bypassPermissions --allowedTools mcp__playwright'
                    prompt: |
                        A comment containing @guiziwebbot triggered this on #${{ github.event.issue.number }} of ${{ github.repository }}. Read the most recent comment by camilleislasse on that item — it is your instruction.

                        The test application is ALREADY mounted and running at https://127.0.0.1:8080 (APP_ENV=test, admin login sylius@example.com / sylius), checked out on the right branch. PHP/Twig edits are served live; if you change JS/SCSS assets, rebuild with `(cd vendor/sylius/test-application && yarn build)` so the running app reflects them.

                        - If it is an ISSUE: implement it with the /guiziweb-bot:fix-issue skill. Run the static gate (ecs/phpstan/phpunit-unit) before opening the PR and report the REAL result — if a check fails or you cannot run it, say so plainly and do not open the PR. Never claim tests passed that you did not actually run. If the change affects the admin UI, verify it live via the Playwright MCP and attach a screenshot. (The PR's own CI is the source of truth; your local gate is just to catch issues early.)
                        - If it is a PULL REQUEST and the comment is just "review": review it with /code-review:code-review.
                        - If it is a PULL REQUEST and the comment is a change request: apply it with /guiziweb-bot:revise-pr (same gate + UI verification rules).

                        Follow the repo conventions (CLAUDE.md, .claude/rules). Labels: the workflow sets `in progress` at the start and `needs review` at the end on the item that triggered you — do NOT touch those. The only label you may set is `blocked`, and only when you give up: if the request is ambiguous or impossible, do not guess — add the `blocked` label and comment explaining why.

            -
                name: DEBUG session dir after claude (TEMP)
                if: ${{ always() }}
                shell: bash
                run: |
                    echo "resolved resume args = '${{ steps.session.outputs.resume-args }}'"
                    echo "session_id output   = '${{ steps.claude.outputs.session_id }}'"
                    echo "== ~/.claude/projects after claude =="
                    ls -la ~/.claude/projects/*/ 2>/dev/null || echo "(no project subdir)"

            -
                name: Save Claude session (per item)
                if: ${{ always() }}
                uses: actions/upload-artifact@v4
                with:
                    name: claude-session-${{ github.event.issue.number }}
                    path: ~/.claude/projects
                    retention-days: 30
                    if-no-files-found: ignore

            -
                name: Report token usage
                if: ${{ always() }}
                continue-on-error: true
                uses: Guiziweb/.github/.github/actions/report-tokens@feat/claude-dispatch
                with:
                    execution-file: ${{ steps.claude.outputs.execution_file }}
                    github-token: ${{ steps.app-token.outputs.token }}

            -
                name: Finalize
                if: ${{ always() }}
                uses: Guiziweb/.github/.github/actions/finalize-dispatch@feat/claude-dispatch
                with:
                    github-token: ${{ steps.app-token.outputs.token }}