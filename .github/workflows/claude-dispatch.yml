name: Claude Dispatch

on:
    workflow_call:

concurrency:
    group: claude-dispatch-${{ github.repository }}-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    dispatch:
        if: >
            github.event.comment.user.login == 'camilleislasse' &&
            contains(github.event.comment.body, '@guiziwebbot')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write

        steps:
            -
                uses: actions/create-github-app-token@v1
                id: app-token
                with:
                    app-id: ${{ secrets.APP_ID }}
                    private-key: ${{ secrets.APP_PRIVATE_KEY }}
                    owner: Guiziweb
                    repositories: ${{ github.event.repository.name }}

            -
                uses: anthropics/claude-code-action@v1
                with:
                    claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    github_token: ${{ steps.app-token.outputs.token }}
                    allowed_bots: 'guiziwebbot'
                    plugin_marketplaces: 'https://github.com/Guiziweb/guiziweb-plugins.git,https://github.com/anthropics/claude-code.git'
                    plugins: 'guiziweb-bot@guiziweb-plugins,code-review@claude-code-plugins'
                    claude_args: '--allowedTools Edit,Write,Read,Glob,Grep,Bash(gh:*),Bash(git:*)'
                    prompt: |
                        A comment containing @guiziwebbot triggered this on #${{ github.event.issue.number }} of ${{ github.repository }}. Read the most recent comment by camilleislasse on that item — it is your instruction.

                        - If #${{ github.event.issue.number }} is an ISSUE: implement what it describes using the /guiziweb-bot:fix-issue skill.
                        - If it is a PULL REQUEST and the comment is just "review": review it with /code-review:code-review.
                        - If it is a PULL REQUEST and the comment is a change request: apply it using the /guiziweb-bot:revise-pr skill (resolve the linked issue from the PR's "Closes #N").

                        Follow the repo conventions (CLAUDE.md, .claude/rules). If the request is ambiguous or impossible, do not guess: comment tagging @camilleislasse and set the "blocked" label.