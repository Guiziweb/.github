name: Claude Dispatch

on:
    workflow_call:

concurrency:
    group: claude-dispatch-${{ github.repository }}-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    dispatch:
        if: >
            github.event.comment.user.login == 'camilleislasse' &&
            contains(github.event.comment.body, '@guiziwebbot')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write

        steps:
            -
                uses: actions/create-github-app-token@v1
                id: app-token
                with:
                    app-id: ${{ secrets.APP_ID }}
                    private-key: ${{ secrets.APP_PRIVATE_KEY }}
                    owner: Guiziweb
                    repositories: ${{ github.event.repository.name }}

            -
                uses: actions/github-script@v7
                id: classify
                with:
                    github-token: ${{ steps.app-token.outputs.token }}
                    script: |
                        const isPr = !!context.payload.issue.pull_request
                        const isFix = /@guiziwebbot\s+fix\b/i.test(context.payload.comment.body)
                        const mode = isPr ? (isFix ? 'revise' : 'review') : (isFix ? 'fix' : 'none')
                        const number = context.payload.issue.number
                        core.setOutput('mode', mode)
                        core.setOutput('number', String(number))
                        let checkoutRef = '', targetIssue = ''
                        if (mode === 'revise') {
                            const res = await github.graphql(
                                `query($owner:String!,$repo:String!,$num:Int!){
                                  repository(owner:$owner,name:$repo){
                                    pullRequest(number:$num){
                                      headRefName
                                      closingIssuesReferences(first:1){ nodes { number } }
                                    }
                                  }
                                }`,
                                { owner: context.repo.owner, repo: context.repo.repo, num: number }
                            )
                            const pr = res.repository.pullRequest
                            checkoutRef = pr.headRefName
                            const node = pr.closingIssuesReferences.nodes[0]
                            targetIssue = node ? String(node.number) : ''
                        }
                        core.setOutput('checkout_ref', checkoutRef)
                        core.setOutput('target_issue', targetIssue)
                        if (mode === 'none') return
                        await github.rest.reactions.createForIssueComment({
                            ...context.repo,
                            comment_id: context.payload.comment.id,
                            content: 'eyes',
                        })

            -
                if: steps.classify.outputs.mode != 'none'
                uses: actions/checkout@v4
                with:
                    token: ${{ steps.app-token.outputs.token }}
                    ref: ${{ steps.classify.outputs.checkout_ref }}
                    fetch-depth: 0

            -
                if: steps.classify.outputs.mode == 'fix' || steps.classify.outputs.mode == 'revise'
                env:
                    GH_TOKEN: ${{ steps.app-token.outputs.token }}
                run: |
                    USER_ID=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
                    git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
                    git config user.email "${USER_ID}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

            -
                if: steps.classify.outputs.mode == 'review'
                uses: anthropics/claude-code-action@v1
                with:
                    claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    github_token: ${{ steps.app-token.outputs.token }}
                    plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
                    plugins: 'code-review@claude-code-plugins'
                    allowed_bots: 'guiziwebbot'
                    prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ steps.classify.outputs.number }} --comment'

            -
                if: steps.classify.outputs.mode == 'fix'
                uses: anthropics/claude-code-action@v1
                with:
                    claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    github_token: ${{ steps.app-token.outputs.token }}
                    allowed_bots: 'guiziwebbot'
                    plugin_marketplaces: 'https://github.com/Guiziweb/guiziweb-plugins.git'
                    plugins: 'guiziweb-bot@guiziweb-plugins'
                    claude_args: '--permission-mode acceptEdits --allowedTools Edit,Write,Read,Glob,Grep,Bash(gh:*),Bash(git:*)'
                    prompt: '/guiziweb-bot:fix-issue ${{ steps.classify.outputs.number }}'

            -
                if: steps.classify.outputs.mode == 'revise'
                uses: anthropics/claude-code-action@v1
                with:
                    claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    github_token: ${{ steps.app-token.outputs.token }}
                    allowed_bots: 'guiziwebbot'
                    plugin_marketplaces: 'https://github.com/Guiziweb/guiziweb-plugins.git'
                    plugins: 'guiziweb-bot@guiziweb-plugins'
                    claude_args: '--permission-mode acceptEdits --allowedTools Edit,Write,Read,Glob,Grep,Bash(gh:*),Bash(git:*)'
                    prompt: '/guiziweb-bot:revise-pr ${{ steps.classify.outputs.number }} ${{ steps.classify.outputs.target_issue }}'