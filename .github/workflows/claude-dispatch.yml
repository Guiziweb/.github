name: Claude Dispatch

on:
    workflow_call:

jobs:
    dispatch:
        if: >
            github.event.comment.user.login == 'camilleislasse' &&
            contains(github.event.comment.body, '@guiziwebbot')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write

        steps:
            -
                uses: actions/create-github-app-token@v1
                id: app-token
                with:
                    app-id: ${{ secrets.APP_ID }}
                    private-key: ${{ secrets.APP_PRIVATE_KEY }}
                    owner: Guiziweb
                    repositories: ${{ github.event.repository.name }}

            -
                uses: actions/github-script@v7
                id: classify
                with:
                    github-token: ${{ steps.app-token.outputs.token }}
                    script: |
                        const isPr = !!context.payload.issue.pull_request
                        const isFix = /@guiziwebbot\s+fix\b/i.test(context.payload.comment.body)
                        const mode = isPr ? 'review' : (isFix ? 'fix' : 'none')
                        core.setOutput('mode', mode)
                        core.setOutput('number', String(context.payload.issue.number))
                        if (mode === 'none') return
                        await github.rest.reactions.createForIssueComment({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            comment_id: context.payload.comment.id,
                            content: 'eyes',
                        })

            -
                if: steps.classify.outputs.mode != 'none'
                uses: actions/checkout@v4
                with:
                    token: ${{ steps.app-token.outputs.token }}
                    fetch-depth: 0

            -
                if: steps.classify.outputs.mode == 'fix'
                env:
                    GH_TOKEN: ${{ steps.app-token.outputs.token }}
                run: |
                    USER_ID=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
                    git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
                    git config user.email "${USER_ID}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

            -
                if: steps.classify.outputs.mode == 'review'
                uses: anthropics/claude-code-action@v1
                with:
                    claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    github_token: ${{ steps.app-token.outputs.token }}
                    plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
                    plugins: 'code-review@claude-code-plugins'
                    allowed_bots: 'guiziwebbot'
                    prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ steps.classify.outputs.number }} --comment'

            -
                if: steps.classify.outputs.mode == 'fix'
                uses: anthropics/claude-code-action@v1
                with:
                    claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    github_token: ${{ steps.app-token.outputs.token }}
                    allowed_bots: 'guiziwebbot'
                    claude_args: '--permission-mode acceptEdits --allowedTools Edit,Write,Read,Glob,Grep'
                    prompt: |
                        Tu travailles sur le repo ${{ github.repository }}, à propos de l'issue #${{ steps.classify.outputs.number }}.

                        1. Lis l'issue #${{ steps.classify.outputs.number }} (titre, description, commentaires).
                        2. Implémente le correctif décrit, en suivant les conventions du repo (CLAUDE.md et .claude/rules s'ils existent).
                        3. Ouvre une Pull Request dont le corps contient "Closes #${{ steps.classify.outputs.number }}".

                        Si l'issue est ambiguë ou que le correctif n'est pas évident, n'invente rien : commente l'issue en taguant @camilleislasse avec tes questions, sans ouvrir de PR.