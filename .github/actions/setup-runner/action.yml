name: Setup runner for the test application
description: Install PHP/Node/MySQL with warm composer/yarn caches, and stage mount.sh so the agent can mount the test application on demand.

inputs:
    php-version:
        description: PHP version to install
        default: "8.3"
    node-version:
        description: Node version to install
        default: "22.x"
    mysql-version:
        description: MySQL version to start
        default: "8.4"

runs:
    using: composite
    steps:
        -
            name: Setup PHP
            uses: shivammathur/setup-php@v2
            with:
                php-version: ${{ inputs.php-version }}
                extensions: intl
                tools: composer:v2, flex, symfony
                coverage: none
        -
            name: Setup Node
            uses: actions/setup-node@v4
            with:
                node-version: ${{ inputs.node-version }}
        -
            name: Get Composer cache directory
            id: composer-cache
            shell: bash
            run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        -
            name: Restore Composer cache
            uses: actions/cache/restore@v4
            with:
                path: ${{ steps.composer-cache.outputs.dir }}
                key: ${{ runner.os }}-php-${{ inputs.php-version }}-composer-${{ hashFiles('**/composer.json **/composer.lock') }}
                restore-keys: |
                    ${{ runner.os }}-php-${{ inputs.php-version }}-composer-
        -
            name: Get Yarn cache directory
            id: yarn-cache
            shell: bash
            run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
        -
            name: Restore Yarn cache
            uses: actions/cache/restore@v4
            with:
                path: ${{ steps.yarn-cache.outputs.dir }}
                key: ${{ runner.os }}-node-${{ inputs.node-version }}-yarn-${{ hashFiles('**/package.json **/yarn.lock') }}
                restore-keys: |
                    ${{ runner.os }}-node-${{ inputs.node-version }}-yarn-

        -
            name: Shutdown default MySQL
            shell: bash
            run: sudo service mysql stop
        -
            name: Setup MySQL
            uses: mirromutth/mysql-action@v1.1
            with:
                mysql version: ${{ inputs.mysql-version }}
                mysql root password: "root"
        -
            name: Stage mount script for the agent
            shell: bash
            run: cp "${GITHUB_ACTION_PATH}/mount.sh" "${RUNNER_TEMP}/mount.sh"